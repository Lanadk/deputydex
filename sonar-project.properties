# =============================================================================
# SonarQube Cloud — analyse du front, lancée par la CI (job `sonar` de
# .github/workflows/ci.yml). Clés : SonarQube Cloud > projet > Information.
# =============================================================================
sonar.organization=lanadk
sonar.projectKey=Lanadk_deputydex
sonar.projectName=DeputyDex

# Code applicatif : app/ (tests à part, client Prisma généré exclu).
sonar.sources=app
sonar.exclusions=app/infrastructure/db/generated/**,app/**/*.test.ts,app/**/*.test.tsx,scripts/db_tests/**,scripts/github_actions_tests/**
sonar.tests=app
sonar.test.inclusions=app/**/*.test.ts,app/**/*.test.tsx

# Couverture : rapport lcov de Jest (`npm run test:coverage`, job `test`).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# scripts/ : outils de dev hors du périmètre de couverture de Jest (collectCoverageFrom : app/).
# Démos de la librairie de composants (pages, exemples, catalogue) : vitrines, pas du code de l'application.
# Types seuls des domaines (DTO, entités, ports I*Repository / I*Gateway) : aucun code exécutable,
# que le fournisseur de couverture v8 compterait comme entièrement non couvert.
sonar.coverage.exclusions=app/**/*.d.ts,scripts/**,app/(ui)/component-library/**/page.tsx,app/(ui)/component-library/**/*.constants.tsx,app/(ui)/component-library/_catalogue/**,app/domains/**/dto/**,app/domains/**/entities/**,app/domains/**/repositories/I*.ts,app/domains/**/gateways/I*.ts

sonar.sourceEncoding=UTF-8
